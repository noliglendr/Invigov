name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/invigov-backend
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt -q
            systemctl restart invigov-api
            systemctl restart invigov-worker
            systemctl restart invigov-scheduler
            sleep 3
            systemctl is-active invigov-api

<svg width="340" height="260" viewBox="0 0 340 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="pshadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.2"/>
    </filter>
    <filter id="sshadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="340" height="260" fill="url(#pbg)" rx="16"/>

  <!-- Background dots pattern -->
  <circle cx="20" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="60" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="100" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="140" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="180" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="220" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="260" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="300" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="320" cy="20" r="3" fill="#DDD6FE" opacity="0.6"/>

  <!-- Credit card (tilted) -->
  <g transform="translate(50, 60) rotate(-5, 120, 80)" filter="url(#pshadow)">
    <rect width="240" height="148" rx="14" fill="url(#cardGrad)"/>
    <!-- Shimmer strip -->
    <rect x="0" y="40" width="240" height="36" fill="rgba(0,0,0,0.2)"/>
    <!-- Chip -->
    <rect x="20" y="18" width="36" height="28" rx="5" fill="#FCD34D" opacity="0.9"/>
    <line x1="20" y1="32" x2="56" y2="32" stroke="#B45309" stroke-width="1" opacity="0.5"/>
    <line x1="38" y1="18" x2="38" y2="46" stroke="#B45309" stroke-width="1" opacity="0.5"/>
    <!-- Card number dots -->
    <circle cx="24" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="34" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="44" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="54" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="74" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="84" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="94" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="104" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="124" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="134" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="144" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="154" cy="100" r="3" fill="rgba(255,255,255,0.5)"/>
    <text x="174" y="104" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" font-weight="600">4 2 1 9</text>
    <!-- Name -->
    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" font-weight="600">BUSINESS OWNER</text>
    <text x="185" y="130" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">12/28</text>
    <!-- Network logo circles -->
    <circle cx="205" cy="20" r="14" fill="#EF4444" opacity="0.8"/>
    <circle cx="218" cy="20" r="14" fill="#F97316" opacity="0.8"/>
  </g>

  <!-- Shield overlay -->
  <g transform="translate(230, 130)" filter="url(#sshadow)">
    <circle cx="36" cy="36" r="36" fill="white"/>
    <path d="M36 8L10 18v16c0 14.4 11.13 27.86 26 31 14.87-3.14 26-16.6 26-31V18L36 8z" fill="#4F46E5" opacity="0.15"/>
    <path d="M36 12L14 21v13c0 11.18 9.13 21.6 22 24 12.87-2.4 22-12.82 22-24V21L36 12z" fill="#4F46E5"/>
    <path d="M28 36l6 6 12-12" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Success badge -->
  <g transform="translate(30, 190)" filter="url(#sshadow)">
    <rect width="180" height="40" rx="20" fill="white" stroke="#DCFCE7" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="12" fill="#16A34A"/>
    <path d="M19 20l3 3 6-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="42" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#374151" font-weight="700">Payment Secured</text>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">Processed by Stripe</text>
  </g>

  <!-- Lock icon top right -->
  <g transform="translate(285, 50)" filter="url(#sshadow)">
    <circle cx="20" cy="20" r="20" fill="white" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="12" y="18" width="16" height="12" rx="2" fill="#4F46E5"/>
    <path d="M14 18v-3a6 6 0 0112 0v3" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="24" r="2" fill="white"/>
    <rect x="19" y="24" width="2" height="3" rx="1" fill="white"/>
  </g>

  <!-- AES-256 label -->
  <g transform="translate(40, 30)">
    <rect width="90" height="22" rx="11" fill="#4F46E5" opacity="0.1" stroke="#DDD6FE" stroke-width="1"/>
    <text x="45" y="15" font-family="system-ui, sans-serif" font-size="9" fill="#4F46E5" text-anchor="middle" font-weight="700">🔒 AES-256</text>
  </g>
</svg>

<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)" rx="16"/>

  <!-- Step flow line -->
  <line x1="60" y1="150" x2="340" y2="150" stroke="#DBEAFE" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- Step 1 - Completed -->
  <g transform="translate(40, 120)">
    <circle cx="20" cy="30" r="20" fill="#2563EB" filter="url(#card-shadow)"/>
    <path d="M13 30l5 5 9-10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#1D4ED8" text-anchor="middle" font-weight="600">Business</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="9" fill="#1D4ED8" text-anchor="middle" font-weight="600">Info</text>
  </g>

  <!-- Step 2 - Completed -->
  <g transform="translate(100, 120)">
    <circle cx="20" cy="30" r="20" fill="#2563EB" filter="url(#card-shadow)"/>
    <path d="M13 30l5 5 9-10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#1D4ED8" text-anchor="middle" font-weight="600">NAICS</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="9" fill="#1D4ED8" text-anchor="middle" font-weight="600">Codes</text>
  </g>

  <!-- Step 3 - Active -->
  <g transform="translate(160, 110)">
    <circle cx="20" cy="40" r="28" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <circle cx="20" cy="40" r="22" fill="#DBEAFE"/>
    <text x="20" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">3</text>
    <text x="20" y="82" font-family="system-ui, sans-serif" font-size="9" fill="#1D4ED8" text-anchor="middle" font-weight="700">Banking</text>
    <text x="20" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#1D4ED8" text-anchor="middle" font-weight="700">Info</text>
    <!-- Pulse ring -->
    <circle cx="20" cy="40" r="32" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>

  <!-- Step 4 - Pending -->
  <g transform="translate(230, 120)">
    <circle cx="20" cy="30" r="20" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="20" y="35" font-family="system-ui, sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle" font-weight="600">4</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle">Reps &amp;</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle">Certs</text>
  </g>

  <!-- Step 5 - Pending -->
  <g transform="translate(290, 120)">
    <circle cx="20" cy="30" r="20" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="20" y="35" font-family="system-ui, sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle" font-weight="600">5</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle">Review</text>
  </g>

  <!-- Document preview card (bottom) -->
  <g transform="translate(80, 200)" filter="url(#card-shadow)">
    <rect width="240" height="65" rx="10" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
    <!-- Doc icon -->
    <rect x="12" y="12" width="28" height="36" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <path d="M32 12l8 8h-8V12z" fill="#BFDBFE"/>
    <rect x="16" y="24" width="18" height="2" rx="1" fill="#BFDBFE"/>
    <rect x="16" y="29" width="14" height="2" rx="1" fill="#BFDBFE"/>
    <rect x="16" y="34" width="18" height="2" rx="1" fill="#BFDBFE"/>
    <!-- Text lines -->
    <rect x="50" y="16" width="90" height="7" rx="3" fill="#DBEAFE"/>
    <rect x="50" y="28" width="70" height="5" rx="2" fill="#EFF6FF"/>
    <!-- Progress -->
    <rect x="50" y="40" width="150" height="6" rx="3" fill="#EFF6FF"/>
    <rect x="50" y="40" width="90" height="6" rx="3" fill="#2563EB"/>
    <text x="205" y="46" font-family="system-ui, sans-serif" font-size="8" fill="#93C5FD" font-weight="600">60%</text>
  </g>

  <!-- Top decorative elements -->
  <circle cx="30" cy="30" r="8" fill="#DBEAFE" opacity="0.6"/>
  <circle cx="370" cy="25" r="6" fill="#BFDBFE" opacity="0.5"/>
  <circle cx="360" cy="270" r="10" fill="#DBEAFE" opacity="0.4"/>
  <circle cx="20" cy="260" r="7" fill="#BFDBFE" opacity="0.5"/>

  <!-- Title -->
  <text x="200" y="35" font-family="system-ui, sans-serif" font-size="14" fill="#1D4ED8" text-anchor="middle" font-weight="700">SAM.gov Registration Workflow</text>
  <text x="200" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#60A5FA" text-anchor="middle">7-step guided federal registration</text>
</svg>

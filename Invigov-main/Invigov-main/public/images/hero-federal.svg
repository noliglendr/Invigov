<svg width="560" height="420" viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="buildingMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="560" height="420" fill="url(#sky)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BFDBFE" stroke-width="0.5" opacity="0.5"/>
  </pattern>
  <rect width="560" height="420" fill="url(#grid)" opacity="0.4"/>

  <!-- Ground -->
  <rect x="0" y="360" width="560" height="60" fill="#EFF6FF"/>
  <rect x="0" y="358" width="560" height="4" fill="#BFDBFE"/>

  <!-- Background buildings (smaller, lighter) -->
  <rect x="30" y="240" width="60" height="120" fill="#E0E7FF" rx="2"/>
  <rect x="35" y="250" width="10" height="14" fill="#C7D2FE" rx="1"/>
  <rect x="50" y="250" width="10" height="14" fill="#C7D2FE" rx="1"/>
  <rect x="65" y="250" width="10" height="14" fill="#C7D2FE" rx="1"/>
  <rect x="35" y="270" width="10" height="14" fill="#C7D2FE" rx="1"/>
  <rect x="50" y="270" width="10" height="14" fill="#C7D2FE" rx="1"/>
  <rect x="65" y="270" width="10" height="14" fill="#C7D2FE" rx="1"/>

  <rect x="460" y="220" width="70" height="140" fill="#E0E7FF" rx="2"/>
  <rect x="465" y="230" width="12" height="16" fill="#C7D2FE" rx="1"/>
  <rect x="482" y="230" width="12" height="16" fill="#C7D2FE" rx="1"/>
  <rect x="499" y="230" width="12" height="16" fill="#C7D2FE" rx="1"/>
  <rect x="465" y="252" width="12" height="16" fill="#C7D2FE" rx="1"/>
  <rect x="482" y="252" width="12" height="16" fill="#C7D2FE" rx="1"/>
  <rect x="499" y="252" width="12" height="16" fill="#C7D2FE" rx="1"/>

  <!-- Main federal building -->
  <g filter="url(#shadow)">
    <!-- Base platform -->
    <rect x="150" y="340" width="260" height="20" fill="#BFDBFE" rx="2"/>
    <rect x="140" y="330" width="280" height="14" fill="#DBEAFE" rx="2"/>

    <!-- Main structure -->
    <rect x="170" y="200" width="220" height="132" fill="url(#buildingMain)" rx="2"/>

    <!-- Columns -->
    <rect x="180" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>
    <rect x="204" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>
    <rect x="228" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>
    <rect x="252" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>
    <rect x="276" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>
    <rect x="300" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>
    <rect x="324" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>
    <rect x="348" y="180" width="14" height="152" fill="#BFDBFE" rx="2"/>

    <!-- Column base line -->
    <rect x="175" y="328" width="210" height="6" fill="#93C5FD" rx="1"/>
    <rect x="175" y="180" width="210" height="8" fill="#93C5FD" rx="1"/>

    <!-- Pediment / triangle top -->
    <polygon points="200,130 360,130 380,180 180,180" fill="#DBEAFE"/>
    <polygon points="210,138 350,138 368,180 192,180" fill="#EFF6FF" opacity="0.6"/>

    <!-- Pediment decoration -->
    <circle cx="280" cy="155" r="18" fill="#BFDBFE" stroke="#93C5FD" stroke-width="2"/>
    <text x="280" y="161" font-family="Georgia, serif" font-size="18" fill="#2563EB" text-anchor="middle" font-weight="bold">★</text>

    <!-- Roof line -->
    <rect x="180" y="128" width="200" height="6" fill="#93C5FD" rx="1"/>

    <!-- Windows / doors on building -->
    <rect x="220" y="250" width="24" height="32" fill="#EFF6FF" rx="2" stroke="#93C5FD" stroke-width="1"/>
    <rect x="258" y="250" width="24" height="32" fill="#EFF6FF" rx="2" stroke="#93C5FD" stroke-width="1"/>

    <!-- Central door -->
    <rect x="265" y="280" width="30" height="52" fill="#BFDBFE" rx="3 3 0 0" stroke="#93C5FD" stroke-width="1.5"/>
    <circle cx="280" cy="308" r="2.5" fill="#2563EB"/>

    <rect x="306" y="250" width="24" height="32" fill="#EFF6FF" rx="2" stroke="#93C5FD" stroke-width="1"/>
    <rect x="334" y="250" width="24" height="32" fill="#EFF6FF" rx="2" stroke="#93C5FD" stroke-width="1"/>
  </g>

  <!-- Floating document cards -->
  <!-- Left card: Registration -->
  <g transform="translate(55, 170)" filter="url(#softShadow)">
    <rect width="110" height="130" rx="10" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
    <rect x="12" y="12" width="86" height="6" rx="3" fill="#BFDBFE"/>
    <rect x="12" y="24" width="60" height="4" rx="2" fill="#DBEAFE"/>
    <rect x="12" y="36" width="86" height="1" fill="#E0F2FE"/>
    <!-- Check items -->
    <circle cx="20" cy="52" r="7" fill="#DCFCE7"/>
    <path d="M17 52l2 2 4-4" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="32" y="49" width="55" height="5" rx="2" fill="#DCFCE7"/>
    <circle cx="20" cy="70" r="7" fill="#DCFCE7"/>
    <path d="M17 70l2 2 4-4" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="32" y="67" width="45" height="5" rx="2" fill="#DCFCE7"/>
    <circle cx="20" cy="88" r="7" fill="#FEF9C3"/>
    <rect x="19" y="85" width="2" height="4" rx="1" fill="#CA8A04"/>
    <rect x="32" y="85" width="60" height="5" rx="2" fill="#FEF9C3"/>
    <!-- Badge -->
    <rect x="10" y="105" width="90" height="16" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="55" y="116" font-family="system-ui, sans-serif" font-size="8" fill="#2563EB" text-anchor="middle" font-weight="600">SAM Registration</text>
  </g>

  <!-- Right card: Compliance -->
  <g transform="translate(400, 155)" filter="url(#softShadow)">
    <rect width="110" height="140" rx="10" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
    <rect x="12" y="12" width="86" height="6" rx="3" fill="#BFDBFE"/>
    <rect x="12" y="24" width="50" height="4" rx="2" fill="#DBEAFE"/>
    <rect x="12" y="36" width="86" height="1" fill="#E0F2FE"/>
    <!-- Calendar icon area -->
    <rect x="12" y="48" width="86" height="55" rx="6" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <rect x="12" y="48" width="86" height="14" rx="6" fill="#DBEAFE"/>
    <rect x="12" y="55" width="86" height="7" fill="#DBEAFE"/>
    <text x="55" y="58" font-family="system-ui, sans-serif" font-size="7" fill="#1D4ED8" text-anchor="middle" font-weight="700">COMPLIANCE</text>
    <!-- Calendar grid -->
    <rect x="18" y="68" width="10" height="8" rx="1" fill="#BFDBFE"/>
    <rect x="32" y="68" width="10" height="8" rx="1" fill="#BFDBFE"/>
    <rect x="46" y="68" width="10" height="8" rx="1" fill="#BFDBFE"/>
    <rect x="60" y="68" width="10" height="8" rx="1" fill="#FCA5A5"/>
    <rect x="74" y="68" width="10" height="8" rx="1" fill="#BFDBFE"/>
    <rect x="18" y="80" width="10" height="8" rx="1" fill="#BFDBFE"/>
    <rect x="32" y="80" width="10" height="8" rx="1" fill="#86EFAC"/>
    <rect x="46" y="80" width="10" height="8" rx="1" fill="#BFDBFE"/>
    <!-- Status row -->
    <rect x="12" y="110" width="40" height="14" rx="7" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="32" y="120" font-family="system-ui, sans-serif" font-size="7" fill="#15803D" text-anchor="middle" font-weight="600">Active</text>
    <rect x="57" y="110" width="40" height="14" rx="7" fill="#FEF9C3" stroke="#FDE047" stroke-width="1"/>
    <text x="77" y="120" font-family="system-ui, sans-serif" font-size="7" fill="#854D0E" text-anchor="middle" font-weight="600">7 days</text>
  </g>

  <!-- Stars decoration top -->
  <circle cx="80" cy="50" r="3" fill="#BFDBFE" opacity="0.8"/>
  <circle cx="100" cy="30" r="2" fill="#93C5FD" opacity="0.6"/>
  <circle cx="460" cy="40" r="3" fill="#BFDBFE" opacity="0.8"/>
  <circle cx="490" cy="60" r="2" fill="#93C5FD" opacity="0.6"/>
  <circle cx="520" cy="35" r="2.5" fill="#DBEAFE" opacity="0.7"/>
  <circle cx="40" cy="80" r="2" fill="#93C5FD" opacity="0.5"/>

  <!-- Shield badge bottom center -->
  <g transform="translate(248, 375)">
    <path d="M16 2L2 7v8c0 7.18 5.82 13 14 14 8.18-1 14-6.82 14-14V7L16 2z" fill="#2563EB" opacity="0.9"/>
    <path d="M11 16l3 3 6-7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>

<svg width="360" height="280" viewBox="0 0 360 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="cshadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#16A34A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="360" height="280" fill="url(#cbg)" rx="16"/>

  <!-- Calendar card -->
  <g transform="translate(30, 30)" filter="url(#cshadow)">
    <rect width="300" height="220" rx="14" fill="white" stroke="#BBF7D0" stroke-width="1.5"/>

    <!-- Header -->
    <rect width="300" height="48" rx="14" fill="#16A34A"/>
    <rect y="34" width="300" height="14" fill="#16A34A"/>
    <text x="150" y="22" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">COMPLIANCE CALENDAR</text>
    <text x="150" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#86EFAC" text-anchor="middle">2025 Renewal Schedule</text>

    <!-- Day headers -->
    <text x="30" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="600">MON</text>
    <text x="70" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="600">TUE</text>
    <text x="110" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="600">WED</text>
    <text x="150" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="600">THU</text>
    <text x="190" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="600">FRI</text>
    <text x="230" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="600">SAT</text>
    <text x="270" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle" font-weight="600">SUN</text>

    <line x1="10" y1="73" x2="290" y2="73" stroke="#F0FDF4" stroke-width="1"/>

    <!-- Week 1 -->
    <text x="30" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">1</text>
    <text x="70" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">2</text>
    <text x="110" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">3</text>
    <text x="150" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">4</text>
    <!-- Highlighted: 5 = deadline -->
    <circle cx="190" cy="88" r="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="190" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">5</text>
    <text x="230" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">6</text>
    <text x="270" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">7</text>

    <!-- Week 2 -->
    <text x="30" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">8</text>
    <text x="70" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">9</text>
    <text x="110" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">10</text>
    <!-- Today -->
    <circle cx="150" cy="114" r="14" fill="#16A34A"/>
    <text x="150" y="119" font-family="system-ui, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">11</text>
    <text x="190" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">12</text>
    <text x="230" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">13</text>
    <!-- Completed -->
    <circle cx="270" cy="114" r="14" fill="#DCFCE7"/>
    <path d="M264 114l4 4 8-8" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Week 3 -->
    <text x="30" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">15</text>
    <text x="70" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">16</text>
    <text x="110" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">17</text>
    <text x="150" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">18</text>
    <!-- Warning -->
    <circle cx="190" cy="140" r="14" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5"/>
    <text x="190" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#854D0E" text-anchor="middle" font-weight="700">19</text>
    <text x="230" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">20</text>
    <text x="270" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">21</text>

    <!-- Legend -->
    <rect x="10" y="165" width="280" height="1" fill="#F0FDF4"/>

    <circle cx="25" cy="180" r="7" fill="#16A34A"/>
    <text x="37" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#374151">Today</text>

    <circle cx="95" cy="180" r="7" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <path d="M91 180l2.5 2.5 5-5" stroke="#16A34A" stroke-width="1.5" fill="none"/>
    <text x="107" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#374151">Completed</text>

    <circle cx="190" cy="180" r="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="202" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#374151">Deadline</text>

    <circle cx="255" cy="180" r="7" fill="#FEF9C3" stroke="#FDE047" stroke-width="1"/>
    <text x="267" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#374151">Due soon</text>

    <!-- Alert strip -->
    <rect x="10" y="195" width="280" height="16" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="150" y="207" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="600">⚠ SAM.gov Annual Renewal — 5 days remaining</text>
  </g>

  <!-- Decorative circles -->
  <circle cx="15" cy="15" r="10" fill="#DCFCE7" opacity="0.5"/>
  <circle cx="345" cy="265" r="12" fill="#BBF7D0" opacity="0.4"/>
  <circle cx="340" cy="15" r="7" fill="#DCFCE7" opacity="0.6"/>
</svg>

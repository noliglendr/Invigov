<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" fill="url(#ebg)" rx="12"/>

  <!-- Clipboard illustration -->
  <g transform="translate(95, 20)">
    <!-- Clipboard body -->
    <rect x="0" y="14" width="90" height="120" rx="6" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Clipboard top -->
    <rect x="20" y="8" width="50" height="16" rx="4" fill="#CBD5E1"/>
    <rect x="28" y="4" width="34" height="12" rx="4" fill="#94A3B8"/>

    <!-- Lines on clipboard -->
    <rect x="12" y="36" width="66" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="12" y="48" width="55" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="12" y="60" width="66" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="12" y="72" width="40" height="5" rx="2.5" fill="#E2E8F0"/>

    <!-- Empty checkbox with ? -->
    <rect x="12" y="88" width="20" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="22" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="600">?</text>
    <rect x="38" y="94" width="40" height="5" rx="2.5" fill="#E2E8F0"/>

    <rect x="12" y="116" width="20" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="600">?</text>
    <rect x="38" y="122" width="30" height="5" rx="2.5" fill="#E2E8F0"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(175, 65)">
    <circle cx="22" cy="22" r="18" fill="white" stroke="#CBD5E1" stroke-width="2.5"/>
    <circle cx="22" cy="22" r="11" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="35" y1="35" x2="46" y2="46" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="140" y="162" font-family="system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="600">No deadlines yet</text>
  <text x="140" y="178" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Complete your SAM workflow first</text>

  <!-- Stars -->
  <circle cx="25" cy="25" r="5" fill="#E2E8F0" opacity="0.7"/>
  <circle cx="255" cy="30" r="4" fill="#E2E8F0" opacity="0.6"/>
  <circle cx="260" cy="170" r="5" fill="#E2E8F0" opacity="0.5"/>
  <circle cx="20" cy="175" r="4" fill="#E2E8F0" opacity="0.6"/>
</svg>
